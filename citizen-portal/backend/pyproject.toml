[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nagardrishti-backend"
version = "0.1.0"
description = "NagarDrishti AI FastAPI Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "supabase>=2.3.0",
    "google-genai>=0.1.0",
    "pillow>=10.2.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.vercel]
entrypoint = "main:app"
